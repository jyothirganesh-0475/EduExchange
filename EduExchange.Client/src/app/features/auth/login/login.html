<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">EduExchange</span>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to continue exchanging knowledge</p>

    <!-- ── Google Sign-In Button ── -->
    <div class="google-btn-wrapper">
      <div id="google-btn-container"></div>
      <div class="google-loading" *ngIf="googleLoading">
        <span>Signing in with Google...</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">or sign in with email</span>
      <span class="divider-line"></span>
    </div>

    <!-- Email -->
    <mat-form-field appearance="outline" class="edu-field full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email"
             placeholder="you@example.com"
             (keyup.enter)="login()" />
      <mat-icon matSuffix>email</mat-icon>
    </mat-form-field>

    <!-- Password -->
    <mat-form-field appearance="outline" class="edu-field full-width">
      <mat-label>Password</mat-label>
      <input matInput [type]="showPass ? 'text' : 'password'"
             [(ngModel)]="password"
             (keyup.enter)="login()" />
      <mat-icon matSuffix (click)="togglePassword()" style="cursor:pointer">
        {{ showPass ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </mat-form-field>

   <div *ngIf="showForgotLink" class="forgot-password-container">
  <p class="error-text">Incorrect details.</p>
  <a (click)="handleForgotPassword()" class="forgot-link">Forgot Password?</a>
</div>


    <!-- Login Button -->
    <button mat-raised-button class="submit-btn"
            (click)="login()" [disabled]="submitting">
      <mat-icon>login</mat-icon>
      {{ submitting ? 'Signing in...' : 'Sign In' }}
    </button>

    <!-- Register Link -->
    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>

  </div>
</div>
