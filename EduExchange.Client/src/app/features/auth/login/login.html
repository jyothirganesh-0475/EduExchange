<div class="auth-page">
  <div class="auth-card animate-fade-in-up">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">EduExchange</span>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to continue exchanging knowledge</p>

    <!-- ── Google Sign-In Button ── -->
    <div class="google-btn-wrapper">
      <div id="google-btn-container"></div>
      <div class="google-loading" *ngIf="googleLoading">
        <span>Signing in with Google...</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">or sign in with email</div>

    <form (ngSubmit)="loginForm.form.valid && login()" #loginForm="ngForm" class="auth-form">
      <!-- Email -->
      <div class="form-group">
        <div class="input-container">
          <input type="email" class="form-input" [(ngModel)]="email" name="email"
                 placeholder="Email" required />
          <mat-icon class="input-icon">email</mat-icon>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="input-container">
          <input [type]="showPass ? 'text' : 'password'" class="form-input"
                 [(ngModel)]="password" name="password"
                 placeholder="Password" required />
          <mat-icon class="input-icon cursor-pointer" (click)="togglePassword()">
            {{ showPass ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </div>
      </div>

      <div *ngIf="showForgotLink" class="error-container">
        <p class="error-text">Incorrect details.</p>
        <a (click)="handleForgotPassword()" class="forgot-link">Forgot Password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="submit-btn" [disabled]="submitting">
        <mat-icon class="submit-icon">login</mat-icon>
        <span>{{ submitting ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>

    <!-- Register Link -->
    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register" class="register-link">Create one</a>
    </p>

  </div>
</div>
