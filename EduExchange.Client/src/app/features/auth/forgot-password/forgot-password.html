<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">EduExchange</span>
    </div>

    <!-- Shield Icon -->
    <div class="top-icon-wrapper">
      <span class="top-icon">🔐</span>
    </div>

    <!-- Dynamic Title -->
    <h2 class="auth-title">Forgot Password?</h2>
    <p class="auth-sub" *ngIf="!otpSent">
      Enter your email address and choose how you want to reset your password.
    </p>
    <p class="auth-sub" *ngIf="otpSent">
      We sent a 6-digit code to your email.
    </p>

    <!-- ── EMAIL FIELD ────────────────────────────────────────────────── -->
    <mat-form-field appearance="outline" class="edu-field full-width">
      <mat-label>Email Address</mat-label>
      <input
        matInput
        type="email"
        [(ngModel)]="email"
        placeholder="you@example.com"
        [disabled]="otpSent"
      />
      <mat-icon matSuffix>email</mat-icon>
    </mat-form-field>

    <!-- ── ACTION BUTTONS (Visible before OTP is sent) ────────────────── -->
    <div class="action-buttons" *ngIf="!otpSent">
      <!-- Send Reset Link -->
      <button
        mat-raised-button
        class="submit-btn primary-btn"
        (click)="sendResetLink()"
        [disabled]="submitting"
      >
        <mat-icon [class.spinner]="submitting && activeAction === 'link'">{{ submitting && activeAction === 'link' ? 'autorenew' : 'link' }}</mat-icon>
        {{ submitting && activeAction === 'link' ? 'Sending Link...' : 'Send Reset Link' }}
      </button>

      <!-- OR Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Send OTP Code -->
      <button
        mat-stroked-button
        class="submit-btn secondary-btn"
        (click)="sendOtpCode()"
        [disabled]="submitting"
      >
        <mat-icon [class.spinner]="submitting && activeAction === 'otp'">{{ submitting && activeAction === 'otp' ? 'autorenew' : 'sms' }}</mat-icon>
        {{ submitting && activeAction === 'otp' ? 'Sending Code...' : 'Send OTP Code' }}
      </button>
    </div>

    <!-- ── OTP SECTION (Visible after OTP is sent) ────────────────────── -->
    <ng-container *ngIf="otpSent">
      <!-- OTP Input -->
      <mat-form-field appearance="outline" class="edu-field full-width">
        <mat-label>Enter 6-digit OTP</mat-label>
        <input
          matInput
          type="text"
          inputmode="numeric"
          maxlength="6"
          [(ngModel)]="otp"
          placeholder="123456"
          (keyup.enter)="verifyOtp()"
        />
        <mat-icon matSuffix>pin</mat-icon>
      </mat-form-field>

      <!-- Verify Button -->
      <button
        mat-raised-button
        class="submit-btn primary-btn otp-verify-btn"
        (click)="verifyOtp()"
        [disabled]="verifying || otp.length < 4"
      >
        <mat-icon [class.spinner]="verifying">{{ verifying ? 'autorenew' : 'verified' }}</mat-icon>
        {{ verifying ? 'Verifying...' : 'Verify & Continue' }}
      </button>

      <!-- Resend OTP -->
      <div class="resend-container">
        <span class="resend-text">Didn't receive it?</span>
        <button 
          mat-button 
          class="resend-btn" 
          [disabled]="resendCooldown > 0" 
          (click)="resendOtp()"
        >
          {{ resendCooldown > 0 ? 'Resend in ' + resendCooldown + 's' : 'Resend Code' }}
        </button>
      </div>
    </ng-container>

    <!-- ── FOOTER ─────────────────────────────────────────────────────── -->
    <div class="auth-footer">
      Remember your password?
      <a (click)="goBack()" class="back-link">Back to Sign In</a>
    </div>

  </div>
</div>
