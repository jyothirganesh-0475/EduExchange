<div class="auth-page">
  <div class="auth-card animate-fade-in-up">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">EduExchange</span>
    </div>

    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Join thousands of students exchanging knowledge</p>

    <!-- ── Google Sign-Up Button ── -->
    <div class="google-btn-wrapper">
      <div id="google-signup-container"></div>
      <div class="google-loading" *ngIf="googleLoading">
        <span>Creating account with Google...</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">or register with email</div>

    <form (ngSubmit)="registerForm.form.valid && register()" #registerForm="ngForm" class="auth-form">
      <!-- Username -->
      <div class="form-group">
        <div class="input-container">
          <input type="text" class="form-input" [(ngModel)]="username" name="username"
                 placeholder="Username (e.g. rahul_ece)" required />
          <mat-icon class="input-icon">person</mat-icon>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <div class="input-container">
          <input type="email" class="form-input" [(ngModel)]="email" name="email"
                 placeholder="Email" required />
          <mat-icon class="input-icon">email</mat-icon>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="input-container">
          <input [type]="showPass ? 'text' : 'password'" class="form-input"
                 [(ngModel)]="password" name="password"
                 placeholder="Password (Minimum 6 characters)" required minlength="6" />
          <mat-icon class="input-icon cursor-pointer" (click)="togglePassword()">
            {{ showPass ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <div class="input-container">
          <input [type]="showConfirmPass ? 'text' : 'password'" class="form-input"
                 [(ngModel)]="confirmPassword" name="confirmPassword"
                 placeholder="Confirm Password" required minlength="6" />
          <mat-icon class="input-icon cursor-pointer" (click)="toggleConfirmPassword()">
            {{ showConfirmPass ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </div>
      </div>

      <!-- Register Button -->
      <button type="submit" class="submit-btn" [disabled]="submitting || !registerForm.form.valid">
        <mat-icon class="submit-icon">person_add</mat-icon>
        <span>{{ submitting ? 'Creating account...' : 'Create Account' }}</span>
      </button>
    </form>

    <!-- Login Link -->
    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login" class="login-link">Sign in</a>
    </p>

  </div>
</div>
