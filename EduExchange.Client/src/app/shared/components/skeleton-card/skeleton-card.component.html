<!-- Card variant (Books, Notes, Items) -->
<ng-container *ngIf="variant === 'card'">
  <div class="skeleton-grid">
    <div class="skeleton-card" *ngFor="let _ of items">
      <div class="skeleton-image pulse"></div>
      <div class="skeleton-body">
        <div class="skeleton-line skeleton-title pulse"></div>
        <div class="skeleton-line skeleton-subtitle pulse"></div>
        <div class="skeleton-line skeleton-text pulse"></div>
        <div class="skeleton-line skeleton-text short pulse"></div>
        <div class="skeleton-footer">
          <div class="skeleton-badge pulse"></div>
          <div class="skeleton-badge small pulse"></div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<!-- Row variant (Exchanges / table rows) -->
<ng-container *ngIf="variant === 'row'">
  <div class="skeleton-rows">
    <div class="skeleton-row" *ngFor="let _ of items">
      <div class="skeleton-circle pulse"></div>
      <div class="skeleton-row-body">
        <div class="skeleton-line skeleton-title pulse"></div>
        <div class="skeleton-line skeleton-text pulse"></div>
      </div>
      <div class="skeleton-badge pulse"></div>
    </div>
  </div>
</ng-container>
